<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Maana Observation Cockpit</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 360px;
      background-color: #0c0c0e;
      color: #f3f4f6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 16px;
      font-size: 12px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 12px;
      border-bottom: 1px solid #27272a;
      margin-bottom: 12px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      background: #4f46e5;
      color: white;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }
    .title {
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.5px;
    }
    .status-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 10px;
      font-family: monospace;
      padding: 3px 8px;
      border-radius: 9999px;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: #34d399;
    }
    .status-pill.paused {
      background: rgba(245, 158, 11, 0.15);
      border-color: rgba(245, 158, 11, 0.4);
      color: #fbbf24;
    }
    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
    }
    .card {
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 10px;
    }
    .card-title {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #a1a1aa;
      margin-bottom: 6px;
      font-weight: 600;
    }
    input {
      width: 100%;
      background: #09090b;
      border: 1px solid #27272a;
      border-radius: 6px;
      padding: 6px 8px;
      color: #f3f4f6;
      font-size: 11px;
      font-family: monospace;
      margin-bottom: 6px;
      outline: none;
    }
    input:focus {
      border-color: #6366f1;
    }
    .btn {
      width: 100%;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.15s;
    }
    .btn-primary {
      background: #4f46e5;
      color: white;
    }
    .btn-primary:hover {
      background: #4338ca;
    }
    .btn-secondary {
      background: #27272a;
      color: #e4e4e7;
      border-color: #3f3f46;
      margin-top: 6px;
    }
    .btn-secondary:hover {
      background: #3f3f46;
    }
    .event-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 160px;
      overflow-y: auto;
    }
    .event-item {
      background: #09090b;
      border: 1px solid #27272a;
      border-radius: 6px;
      padding: 6px 8px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .event-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .event-type {
      font-size: 9px;
      font-family: monospace;
      font-weight: 700;
      color: #818cf8;
      background: rgba(99, 102, 241, 0.1);
      padding: 1px 4px;
      border-radius: 4px;
    }
    .event-time {
      font-size: 9px;
      color: #71717a;
      font-family: monospace;
    }
    .event-title {
      font-size: 10px;
      color: #d4d4d8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
      font-size: 10px;
      color: #71717a;
    }
    .link {
      color: #818cf8;
      text-decoration: none;
      font-weight: 500;
      cursor: pointer;
    }
    .link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <div class="logo">M</div>
      <div class="title">MAANA</div>
    </div>
    <div id="statusPill" class="status-pill">
      <span class="dot"></span>
      <span id="statusText">Active Tracking</span>
    </div>
  </div>

  <div class="card">
    <div class="card-title">Session Connection Token</div>
    <input id="tokenInput" type="text" placeholder="Paste session token..." />
    <button id="saveTokenBtn" class="btn btn-primary">Connect Session</button>
    <button id="pauseToggleBtn" class="btn btn-secondary">Pause Tracking</button>
  </div>

  <div class="card">
    <div class="card-title">Live Observation Stream</div>
    <div id="eventList" class="event-list">
      <div style="text-align: center; color: #71717a; padding: 12px 0;">
        Waiting for tab activity...
      </div>
    </div>
  </div>

  <div class="footer">
    <span>Fast Clock Ingestion</span>
    <span id="openCockpitLink" class="link">Open Web Cockpit ↗</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
